name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The suite went red on 2026-08-22 because a fixture's `expiresAt` literal
  # passed, and nothing told anyone — there was no CI at all, and the extension
  # only gets built when someone cuts a .vsix. A nightly run is what turns
  # "this rots on a date" into a message rather than a surprise during a demo.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -p ./ --noEmit

      - name: Tests
        run: pnpm exec vitest run
